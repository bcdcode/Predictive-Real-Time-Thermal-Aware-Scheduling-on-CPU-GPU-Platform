<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GPU Thermal Workload</title>
</head>

<body style="margin:0;background:#000;color:#fff;font:16px monospace">

<canvas id="c" width="1280" height="720"></canvas>
<div id="info" style="position:fixed;top:10px;left:10px"></div>

<script>
const params = new URLSearchParams(location.search);
const duty = Math.max(0, Math.min(100, Number(params.get("duty") || 100)));

const canvas = document.getElementById("c");
const info = document.getElementById("info");

const gl = canvas.getContext("webgl2", {
    antialias: false,
    powerPreference: "high-performance"
});

if (!gl) {
    info.textContent = "WebGL2 unavailable";
    throw new Error("WebGL2 unavailable");
}

const vs = `#version 300 es
in vec2 p;
out vec2 uv;

void main() {
    uv = p * 0.5 + 0.5;
    gl_Position = vec4(p, 0.0, 1.0);
}`;

const fs = `#version 300 es
precision highp float;

in vec2 uv;
out vec4 outColor;

uniform float t;

void main() {

    vec2 z = uv * 2.0 - 1.0;

    float a = 0.0;
    float b = 0.0;

    for (int i = 0; i < 80; i++) {

        float fi = float(i) + 1.0;

        a += sin(z.x * fi + t * 0.013)
           * cos(z.y * fi - t * 0.017);

        b += sqrt(abs(a) + 0.001)
           + log(abs(a) + 1.001);

        z = vec2(
            z.x*z.x - z.y*z.y,
            2.0*z.x*z.y
        ) * 0.995;

        z += vec2(
            sin(fi + t*0.003),
            cos(fi - t*0.002)
        ) * 0.0007;
    }

    float v = 0.5 + 0.5 * sin(a + b + t*0.01);

    outColor = vec4(
        v,
        fract(abs(a)*0.01),
        fract(abs(b)*0.01),
        1.0
    );
}`;

function compile(type, src) {

    const s = gl.createShader(type);

    gl.shaderSource(s, src);
    gl.compileShader(s);

    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(s));
    }

    return s;
}

const prog = gl.createProgram();

gl.attachShader(
    prog,
    compile(gl.VERTEX_SHADER, vs)
);

gl.attachShader(
    prog,
    compile(gl.FRAGMENT_SHADER, fs)
);

gl.linkProgram(prog);

if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(prog));
}

gl.useProgram(prog);

const buf = gl.createBuffer();

gl.bindBuffer(gl.ARRAY_BUFFER, buf);

gl.bufferData(
    gl.ARRAY_BUFFER,
    new Float32Array([
        -1,-1,
         1,-1,
        -1, 1,
         1, 1
    ]),
    gl.STATIC_DRAW
);

const loc = gl.getAttribLocation(prog, "p");

gl.enableVertexAttribArray(loc);

gl.vertexAttribPointer(
    loc,
    2,
    gl.FLOAT,
    false,
    0,
    0
);

const timeLoc = gl.getUniformLocation(prog, "t");

let frames = 0;
let running = true;
let start = performance.now();

function render(now) {

    if (!running)
        return;

    /*
       100 ms period.

       duty = 25  -> 25 ms GPU work + 75 ms idle
       duty = 50  -> 50 ms GPU work + 50 ms idle
       duty = 75  -> 75 ms GPU work + 25 ms idle
       duty = 100 -> continuous GPU work
    */

    const cycle = 100;

    const pos = (now - start) % cycle;

    const on = pos < duty;

    if (on) {

        gl.uniform1f(timeLoc, now);

        gl.drawArrays(
            gl.TRIANGLE_STRIP,
            0,
            4
        );

        gl.finish();

        frames++;
    }

    info.textContent =
        "GPU workload duty=" + duty +
        "%  rendered=" + frames;

    requestAnimationFrame(render);
}

requestAnimationFrame(render);

window.addEventListener(
    "beforeunload",
    () => running = false
);
</script>

</body>
</html>
